<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar em Contato</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="curriculo">
        <header>
            <h1>Formulário de Contato</h1>
        </header>

        <hr>

        <main>
            <section>
                <h2>Preencha os Campos</h2>
                
                <form action="#" method="POST">
                    <p>
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" required>
                    </p>

                    <p>
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required>
                    </p>

                    <p>
                        <label for="telefone">Telefone:</label>
                        <input type="tel" id="telefone" name="telefone">
                    </p>

                    <p>
                        <span style="color: #8b949e; font-weight: bold;">Você é um recrutador?</span><br>
                        <input type="radio" id="sim" name="recrutador" value="sim" checked>
                        <label for="sim">Sim</label>
                        <input type="radio" id="nao" name="recrutador" value="nao">
                        <label for="nao">Não</label>
                    </p>

                    <p>
                        <label for="mensagem">Mensagem:</label>
                        <textarea id="mensagem" name="mensagem" rows="5" required></textarea>
                    </p>

                    <p>
                        <button type="submit">Enviar</button>
                    </p>
                </form>
            </section>

            <br>
            <p><a href="index.html">Voltar para a página principal</a></p>
        </main>
    </div>

</body>
</html>
